<!DOCTYPE html>
<html>
<head>
    <title>Defense Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        .container { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .box { background: #222; border: 1px solid #444; border-radius: 10px; padding: 20px; width: 30%; height: 400px; overflow-y: auto; }
        
        .terminal { background: #000; border: 1px solid #0088ff; border-radius: 5px; padding: 15px; font-family: 'Courier New', monospace; text-align: left; color: #00ff00; height: 150px; overflow-y: auto; margin: 20px auto; width: 80%; box-shadow: 0 0 10px rgba(0, 136, 255, 0.2); }
        .term-red { color: #ff4444; } .term-blue { color: #0088ff; } .term-white { color: white; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; border-bottom: 2px solid #555; padding: 10px; position: sticky; top: 0; background: #222; z-index: 2; }
        td { text-align: left; padding: 8px; border-bottom: 1px solid #333; font-family: monospace; font-size: 14px; }
        
        input { padding: 10px; font-size: 16px; width: 200px; border-radius: 5px; border: none; text-align: center; }
        .text-green { color: #00ff00; } .text-blue { color: #0088ff; font-weight: bold; } .text-red { color: #ff4444; font-weight: bold; }
        button { padding: 15px 30px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; margin: 10px; color: white; font-weight: bold; transition: 0.2s; }
        .btn-green { background: #008000; } .btn-green:hover { background: #00aa00; transform: scale(1.05); }
        .btn-red { background: #b30000; } .btn-red:hover { background: #ff0000; transform: scale(1.05); }
        .chart-container { height: 200px; width: 80%; margin: auto; background: #1a1a1a; padding: 15px; border-radius: 10px; }
        .back-btn { position: absolute; top: 20px; left: 20px; text-decoration: none; color: #888; border: 1px solid #444; padding: 5px 15px; border-radius: 5px; }
        .back-btn:hover { background: #333; color: white; }
    </style>
</head>
<body>
    <a href="/" class="back-btn">← Home</a>
    <h1 style="color: #0088ff;">🛡️ DEFENSE SYSTEM (TRIE ENGINE)</h1>

    <div id="terminal" class="terminal">
        <div class="term-blue">[SYSTEM READY] Trie Memory Loaded.</div>
        <div class="term-white">> Waiting for manual input...</div>
    </div>

    <div>
        <input type="text" id="ipInput" placeholder="Enter IP (e.g. 6.6.6.6)">
        <br>
        <button class="btn-green" onclick="send('normal')">CHECK PACKET</button>
        <button class="btn-red" onclick="send('attack')">TEST DDOS</button>
    </div>

    <div class="chart-container"><canvas id="trafficChart"></canvas></div>

    <div class="container">
        <div class="box" style="border-top: 4px solid #fff;">
            <h3 style="color: white;">📋 TRIE RULES (MEMORY)</h3>
            <p style="color: #888; font-size: 12px;">These IPs will be BLOCKED if you type them.</p>
            <table><thead><tr><th>IP Address</th><th>Status</th></tr></thead><tbody id="trieTable"><tr><td colspan="2">Loading...</td></tr></tbody></table>
        </div>

        <div class="box" style="border-top: 4px solid #00ff00;">
            <h3 class="text-green">✅ ALLOWED</h3>
            <table><thead><tr><th>ID</th><th>IP</th><th>Info</th></tr></thead><tbody id="safeTable"></tbody></table>
        </div>

        <div class="box" style="border-top: 4px solid #0088ff;">
            <h3 class="text-blue">🛡️ BLOCKED</h3>
            <table><thead><tr><th>ID</th><th>IP</th><th>Info</th></tr></thead><tbody id="attackTable"></tbody></table>
        </div>
    </div>

    <script>
        function logToTerminal(html) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div>${html}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        const ctx = document.getElementById('trafficChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(30).fill(''), datasets: [{ label: 'Safe', borderColor: '#00ff00', backgroundColor: 'rgba(0, 255, 0, 0.1)', data: Array(30).fill(0), fill: true, tension: 0.1 }, { label: 'Blocked', borderColor: '#0088ff', backgroundColor: 'rgba(0, 136, 255, 0.5)', data: Array(30).fill(0), fill: true, tension: 0.1 }] },
            options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, suggestedMax: 5, grid: { color: '#333' } }, x: { display: false } }, elements: { point: { radius: 0 } } }
        });

        function send(type) {
            const ip = document.getElementById('ipInput').value || "0.0.0.0";
            fetch('/trigger_defense', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: type, ip: ip}) });
            
            logToTerminal(`<br><span class='term-white'>[INPUT] Checking IP: ${ip}...</span>`);
            setTimeout(() => logToTerminal("<span class='term-white'> > Traversing Trie Nodes...</span>"), 100);
        }

        function updateTrieRules() {
            fetch('/trie_rules').then(res => res.json()).then(data => {
                let html = "";
                data.forEach(rule => { html += `<tr><td class="term-red">${rule.ip}</td><td>⛔ ${rule.status}</td></tr>`; });
                document.getElementById('trieTable').innerHTML = html;
            }).catch(e => {});
        }
        updateTrieRules();

        let lastGreen = -1, lastRed = -1;
        setInterval(() => {
            fetch('/logs_defense').then(res => res.json()).then(data => {
                const safeTable = document.getElementById('safeTable');
                const attackTable = document.getElementById('attackTable');
                let currGreen = 0, currRed = 0, safeHTML = "", attackHTML = "";

                for (let i = data.length - 1; i >= 0; i--) {
                    let log = data[i];
                    if (log.type === 'G') {
                        currGreen++;
                        safeHTML += `<tr><td>${log.id}</td><td class="text-green">${log.ip}</td><td>${log.info}</td></tr>`;
                    } else {
                        currRed++;
                        attackHTML += `<tr><td>${log.id}</td><td class="text-red">${log.ip}</td><td class="text-blue">${log.info}</td></tr>`;
                    }
                }
                safeTable.innerHTML = safeHTML;
                attackTable.innerHTML = attackHTML;

                if (lastGreen !== -1) {
                    chart.data.datasets[0].data.push(Math.max(0, currGreen - lastGreen));
                    chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.push(Math.max(0, currRed - lastRed));
                    chart.data.datasets[1].data.shift();
                    chart.update();
                }
                lastGreen = currGreen; lastRed = currRed;
            }).catch(e => {});
        }, 300); 
    </script>
</body>
</html>
