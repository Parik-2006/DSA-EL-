<!DOCTYPE html>
<html>
<head>
    <title>Legacy Traffic Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #050505; color: #e0e0e0; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        
        h1 { text-shadow: 0 0 10px #00ff00; letter-spacing: 2px; }
        
        .container { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .box { background: #111; border: 1px solid #333; border-radius: 5px; padding: 20px; width: 45%; height: 400px; overflow-y: auto; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; border-bottom: 2px solid #555; padding: 10px; position: sticky; top: 0; background: #111; z-index: 2; color: #fff; }
        td { text-align: left; padding: 8px; border-bottom: 1px solid #222; color: #aaa; }
        
        .text-green { color: #00ff00; text-shadow: 0 0 5px rgba(0,255,0,0.5); }
        .text-red { color: #ff3333; font-weight: bold; text-shadow: 0 0 5px rgba(255,0,0,0.5); }
        
        input { padding: 12px; font-size: 16px; width: 250px; border-radius: 3px; border: 1px solid #444; background: #000; color: #00ff00; text-align: center; font-family: monospace; }
        input:focus { outline: none; border-color: #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.3); }
        
        .message-box {
            display: none; background: #332b00; color: #ffcc00; font-weight: bold;
            padding: 10px; border: 1px solid #ffcc00; margin: 15px auto; width: 50%;
            font-family: sans-serif;
        }

        button { padding: 15px 30px; font-size: 14px; cursor: pointer; border: 1px solid; border-radius: 3px; margin: 10px; color: white; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; background: transparent; }
        .btn-green { border-color: #00ff00; color: #00ff00; } .btn-green:hover { background: #00ff00; color: black; box-shadow: 0 0 15px #00ff00; }
        .btn-red { border-color: #ff3333; color: #ff3333; } .btn-red:hover { background: #ff3333; color: black; box-shadow: 0 0 15px #ff3333; }
        
        .chart-container { height: 250px; width: 80%; margin: auto; background: #0a0a0a; padding: 15px; border: 1px solid #333; }
        .back-btn { position: absolute; top: 20px; left: 20px; text-decoration: none; color: #666; border: 1px solid #333; padding: 5px 15px; }
        .back-btn:hover { color: white; border-color: white; }
    </style>
</head>
<body>
    <a href="/" class="back-btn">[ BACK ]</a>
    <h1>LEGACY PACKET INSPECTOR</h1>

    <div>
        <input type="text" id="ipInput" placeholder="ENTER IP ADDRESS">
    </div>

    <div id="msgBox" class="message-box">
        [ERROR] INVALID IP FORMAT<br>
        <span style="font-size: 12px; font-weight: normal;">Require: 4 octets (0-255). Example: 192.168.1.5</span>
    </div>

    <div>
        <button class="btn-green" onclick="send('normal')">ANALYZE PACKET</button>
        <button class="btn-red" onclick="send('attack')">SIMULATE FLOOD</button>
    </div>

    <div class="chart-container"><canvas id="trafficChart"></canvas></div>

    <div class="container">
        <div class="box" style="border-top: 2px solid #00ff00;">
            <h3 class="text-green">[ AUTHORIZED TRAFFIC ]</h3>
            <table><thead><tr><th>ID</th><th>IP Address</th><th>Status</th></tr></thead><tbody id="safeTable"></tbody></table>
        </div>
        <div class="box" style="border-top: 2px solid #ff3333;">
            <h3 class="text-red">[ SUSPICIOUS ACTIVITY ]</h3>
            <table><thead><tr><th>ID</th><th>IP Address</th><th>Alert</th></tr></thead><tbody id="attackTable"></tbody></table>
        </div>
    </div>

    <script>
        function checkIPAndShowMessage() {
            const ip = document.getElementById('ipInput').value;
            const msgBox = document.getElementById('msgBox');
            const ipRegex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            
            if (ip.length > 0 && !ipRegex.test(ip)) {
                msgBox.style.display = 'block'; return false;
            } else {
                msgBox.style.display = 'none'; return true;
            }
        }

        function send(type) {
            checkIPAndShowMessage();
            const ip = document.getElementById('ipInput').value || "0.0.0.0";
            fetch('/trigger_legacy', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: type, ip: ip}) });
        }

        const ctx = document.getElementById('trafficChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(30).fill(''), datasets: [{ label: 'Normal', borderColor: '#00ff00', backgroundColor: 'rgba(0, 255, 0, 0.1)', data: Array(30).fill(0), fill: true, tension: 0.1 }, { label: 'Floods', borderColor: '#ff3333', backgroundColor: 'rgba(255, 0, 0, 0.2)', data: Array(30).fill(0), fill: true, tension: 0.1 }] },
            options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#222' } }, x: { display: false } }, elements: { point: { radius: 0 } } }
        });

        let lastGreen = -1, lastRed = -1;
        setInterval(() => {
            fetch('/logs').then(res => res.json()).then(data => {
                const safeTable = document.getElementById('safeTable');
                const attackTable = document.getElementById('attackTable');
                let currGreen = 0, currRed = 0, safeHTML = "", attackHTML = "";

                for (let i = data.length - 1; i >= 0; i--) {
                    let log = data[i];
                    if (log.type === 'G') {
                        currGreen++;
                        safeHTML += `<tr><td>${log.id}</td><td class="text-green">${log.ip}</td><td>${log.info}</td></tr>`;
                    } else {
                        currRed++;
                        attackHTML += `<tr><td>${log.id}</td><td class="text-red">${log.ip}</td><td>${log.info}</td></tr>`;
                    }
                }
                safeTable.innerHTML = safeHTML;
                attackTable.innerHTML = attackHTML;

                if (lastGreen !== -1) {
                    chart.data.datasets[0].data.push(Math.max(0, currGreen - lastGreen)); chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.push(Math.max(0, currRed - lastRed)); chart.data.datasets[1].data.shift();
                    chart.update();
                }
                lastGreen = currGreen; lastRed = currRed;
            }).catch(e => {});
        }, 300); 
    </script>
</body>
</html>
