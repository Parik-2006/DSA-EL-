<!DOCTYPE html>
<html>
<head>
    <title>DDoS Defense Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        
        /* HEADER */
        h1 { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; margin-bottom: 5px; }
        .welcome { color: #888; font-size: 14px; margin-bottom: 30px; }

        /* LAYOUT */
        .main-grid { display: flex; justify-content: center; gap: 30px; align-items: flex-start; }
        
        /* LEFT: BLOCKLIST */
        .blocklist-box { 
            width: 250px; height: 300px; background: #111; 
            border: 1px solid #333; overflow-y: auto; text-align: left; padding: 10px;
        }
        .blocklist-box h3 { border-bottom: 1px solid #555; color: #ff3333; margin-top: 0; }
        .ip-item { color: #cc5555; font-size: 13px; margin: 5px 0; }

        /* CENTER: CONTROLS & GRAPH */
        .center-panel { width: 600px; }
        
        input { padding: 12px; width: 300px; background: #000; border: 1px solid #00ffcc; color: #00ffcc; text-align: center; font-family: inherit; font-size: 16px; margin-bottom: 15px; }
        
        .btn-group { margin-bottom: 20px; }
        button { padding: 12px 25px; font-weight: bold; cursor: pointer; border: 1px solid; background: transparent; color: #fff; transition: 0.2s; margin: 0 10px; }
        .btn-green { border-color: #00ff00; color: #00ff00; } .btn-green:hover { background: #00ff00; color: #000; }
        .btn-red { border-color: #ff0044; color: #ff0044; } .btn-red:hover { background: #ff0044; color: #fff; }

        .chart-container { background: #111; border: 1px solid #333; padding: 15px; height: 250px; border-radius: 8px; }

        /* TABLES */
        .tables-row { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
        .table-box { width: 45%; background: #111; border: 1px solid #333; padding: 10px; min-height: 150px; }
        table { width: 100%; font-size: 12px; border-collapse: collapse; }
        th { border-bottom: 1px solid #444; color: #888; padding: 5px; }
        td { padding: 5px; border-bottom: 1px solid #222; }

        .green-box { border-top: 3px solid #00ff00; }
        .red-box { border-top: 3px solid #ff0044; }

    </style>
</head>
<body>

    <h1>DDOS MITIGATION ENGINE</h1>
    <p class="welcome">Hi, welcome to the live demonstration of DDoS Attack & Defense Algorithms.</p>

    <div class="main-grid">
        
        <div class="blocklist-box">
            <h3>⛔ BLOCKED DATABASE</h3>
            {% for ip in blocked_ips %}
                <div class="ip-item">> {{ ip }}</div>
            {% endfor %}
        </div>

        <div class="center-panel">
            <input type="text" id="ipInput" placeholder="Enter IP (e.g. 192.168.1.5)">
            
            <div class="btn-group">
                <button class="btn-green" onclick="trigger('NORMAL')">✔ AUTHORIZED TRAFFIC</button>
                <button class="btn-red" onclick="trigger('ATTACK')">☢ LAUNCH DDoS ATTACK</button>
            </div>

            <div class="chart-container">
                <canvas id="algoChart"></canvas>
            </div>
        </div>
    </div>

    <div class="tables-row">
        <div class="table-box green-box">
            <h3 style="color:#00ff00; margin:0 0 10px 0;">AUTHORIZED LOGS</h3>
            <table>
                <thead><tr><th>IP</th><th>Status</th><th>Latency</th></tr></thead>
                <tbody id="green-body"></tbody>
            </table>
        </div>

        <div class="table-box red-box">
            <h3 style="color:#ff0044; margin:0 0 10px 0;">BLOCKED / ATTACK LOGS</h3>
            <table>
                <thead><tr><th>IP</th><th>Status</th><th>Algo Used</th></tr></thead>
                <tbody id="red-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- VALIDATION ---
        function validateIP(ip) {
            const regex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            return regex.test(ip);
        }

        // --- TRIGGER LOGIC ---
        function trigger(mode) {
            const ip = document.getElementById('ipInput').value;
            if(!validateIP(ip)) { alert("INVALID IP ADDRESS! Please enter format: x.x.x.x"); return; }

            // Clear previous table to show fresh result
            if(mode === 'NORMAL') document.getElementById('green-body').innerHTML = "<tr><td colspan='3'>Processing...</td></tr>";
            else document.getElementById('red-body').innerHTML = "<tr><td colspan='3'>MITIGATING ATTACK...</td></tr>";

            fetch('/trigger', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mode: mode, ip: ip})
            });

            startPolling(mode);
        }

        // --- POLLING & UI UPDATE ---
        function startPolling(mode) {
            let interval = setInterval(() => {
                fetch('/data?t=' + Date.now()).then(r => r.json()).then(d => {
                    const stats = d.stats;
                    const logs = d.logs;

                    if(stats.array > 0 || stats.stride > 0) {
                        clearInterval(interval);
                        
                        // 1. UPDATE GRAPH
                        myChart.data.datasets[0].data = [stats.array, stats.string, stats.binary, stats.stride];
                        myChart.update();

                        // 2. UPDATE TABLES
                        if(Array.isArray(logs)) { 
                             let html = "";
                            logs.forEach(l => {
                                html += `<tr><td>${l.ip}</td><td>${l.status}</td><td>${mode === 'NORMAL' ? l.latency : l.algo}</td></tr>`;
                            });

                            if(mode === 'NORMAL') document.getElementById('green-body').innerHTML = html;
                            else document.getElementById('red-body').innerHTML = html;
                        }
                    }
                });
            }, 500);
        }

        // --- CHART SETUP ---
        const ctx = document.getElementById('algoChart').getContext('2d');
        const myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Linear Array (Legacy)', 'String Trie', 'Binary Trie', 'Stride-4 Engine (New)'],
                datasets: [{
                    label: 'Processing Time (ms)',
                    data: [0, 0, 0, 0],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.7)', // Red (Array)
                        'rgba(54, 162, 235, 0.7)', // Blue (String)
                        'rgba(255, 206, 86, 0.7)', // Yellow (Binary)
                        'rgba(75, 192, 192, 0.9)'  // Teal (New Algo - Fastest)
                    ]
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: { y: { beginAtZero: true, title: {display: true, text: 'Latency (Lower is Better)'} } }
            }
        });
    </script>
</body>
</html>
