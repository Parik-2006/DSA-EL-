<!DOCTYPE html>
<html>
<head>
    <title>Defense System</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background: #000; color: #ccc; font-family: 'Consolas', 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; }
        
        h1 { color: #00aaff; text-shadow: 0 0 10px #00aaff; }

        .container { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .box { background: #0a0a0a; border: 1px solid #333; border-radius: 0; padding: 20px; width: 30%; height: 400px; overflow-y: auto; }
        
        /* TERMINAL STYLE ENHANCED */
        .terminal { 
            background: #000; border: 1px solid #00aaff; padding: 15px; 
            text-align: left; color: #00ff00; height: 180px; overflow-y: auto; 
            margin: 20px auto; width: 80%; box-shadow: 0 0 10px rgba(0, 170, 255, 0.2);
            font-size: 14px;
        }
        .term-red { color: #ff3333; } .term-blue { color: #00aaff; } .term-white { color: #fff; } .term-yellow { color: #ffcc00; }

        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th { text-align: left; border-bottom: 1px solid #00aaff; padding: 10px; position: sticky; top: 0; background: #000; z-index: 2; color: #00aaff; }
        td { text-align: left; padding: 8px; border-bottom: 1px solid #222; }
        
        input { padding: 10px; font-size: 16px; width: 250px; border: 1px solid #00aaff; background: #000; color: #00aaff; text-align: center; font-family: inherit; }
        input:focus { outline: none; box-shadow: 0 0 10px #00aaff; }

        .message-box { display: none; background: #220000; color: #ff3333; border: 1px solid #ff3333; padding: 10px; margin: 15px auto; width: 50%; }

        .text-green { color: #00ff00; } .text-blue { color: #00aaff; } .text-red { color: #ff3333; }
        
        button { padding: 15px 30px; font-size: 14px; cursor: pointer; border: 1px solid; background: transparent; margin: 10px; font-weight: bold; font-family: inherit; text-transform: uppercase; transition: 0.2s; }
        .btn-green { border-color: #00ff00; color: #00ff00; } .btn-green:hover { background: #00ff00; color: black; }
        .btn-red { border-color: #ff3333; color: #ff3333; } .btn-red:hover { background: #ff3333; color: black; }

        .chart-container { height: 200px; width: 80%; margin: auto; background: #050505; padding: 15px; border: 1px solid #333; }
        .back-btn { position: absolute; top: 20px; left: 20px; text-decoration: none; color: #666; border: 1px solid #333; padding: 5px 15px; }
        .back-btn:hover { color: #00aaff; border-color: #00aaff; }
    </style>
</head>
<body>
    <a href="/" class="back-btn">[ SYSTEM ROOT ]</a>
    <h1>DEFENSE SYSTEM (ACTIVE)</h1>

    <div id="terminal" class="terminal">
        <div class="term-blue">[INIT] Rate Limiter: ON (3 req / 10s)</div>
        <div class="term-blue">[INIT] Trie Engine: LOADED</div>
        <div class="term-white">_ Waiting for packet injection...</div>
    </div>

    <div>
        <input type="text" id="ipInput" placeholder="ENTER TARGET IP">
    </div>

    <div id="msgBox" class="message-box">
        [ERROR] INVALID IP FORMAT DETECTED
    </div>

    <div>
        <button class="btn-green" onclick="send('normal')">CHECK PACKET</button>
        <button class="btn-red" onclick="send('attack')">SIMULATE ATTACK</button>
    </div>

    <div class="chart-container"><canvas id="trafficChart"></canvas></div>

    <div class="container">
        <div class="box" style="border-top: 2px solid #fff;">
            <h3 style="color: white;">[ ACTIVE RULES ]</h3>
            <table><thead><tr><th>Type</th><th>Target</th></tr></thead><tbody id="trieTable"><tr><td colspan="2">Loading Data...</td></tr></tbody></table>
        </div>

        <div class="box" style="border-top: 2px solid #00ff00;">
            <h3 class="text-green">[ ALLOWED ]</h3>
            <table><thead><tr><th>ID</th><th>IP</th><th>Status</th></tr></thead><tbody id="safeTable"></tbody></table>
        </div>

        <div class="box" style="border-top: 2px solid #00aaff;">
            <h3 class="text-blue">[ BLOCKED ]</h3>
            <table><thead><tr><th>ID</th><th>IP</th><th>Reason</th></tr></thead><tbody id="attackTable"></tbody></table>
        </div>
    </div>

    <script>
        function logToTerminal(html) {
            const term = document.getElementById('terminal');
            term.innerHTML += `<div>${html}</div>`;
            term.scrollTop = term.scrollHeight;
        }

        const ctx = document.getElementById('trafficChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: { labels: Array(30).fill(''), datasets: [{ label: 'Passed', borderColor: '#00ff00', backgroundColor: 'rgba(0, 255, 0, 0.1)', data: Array(30).fill(0), fill: true, tension: 0.1 }, { label: 'Blocked', borderColor: '#00aaff', backgroundColor: 'rgba(0, 170, 255, 0.2)', data: Array(30).fill(0), fill: true, tension: 0.1 }] },
            options: { animation: false, responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, grid: { color: '#222' } }, x: { display: false } }, elements: { point: { radius: 0 } } }
        });

        function checkIPAndShowMessage() {
            const ip = document.getElementById('ipInput').value;
            const msgBox = document.getElementById('msgBox');
            const ipRegex = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;

            if (ip.length > 0 && !ipRegex.test(ip)) {
                msgBox.style.display = 'block'; return false;
            } else {
                msgBox.style.display = 'none'; return true;
            }
        }

        let clickCount = 0;
        
        function send(type) {
            const isValid = checkIPAndShowMessage();
            const ip = document.getElementById('ipInput').value || "0.0.0.0";
            fetch('/trigger_defense', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({action: type, ip: ip}) });
            
            if (!isValid) return; 

            clickCount++;
            logToTerminal(`<br><span class='term-white'>[INPUT] Packet received: ${ip}</span>`);
            
            if (clickCount > 3) {
                 setTimeout(() => logToTerminal("<span class='term-yellow'> > Analyzing Rate Limit...</span>"), 100);
                 setTimeout(() => logToTerminal("<span class='term-red'> > [DROP] RATE LIMIT EXCEEDED</span>"), 200);
            } else {
                 setTimeout(() => logToTerminal("<span class='term-white'> > Analyzing Rate Limit... OK</span>"), 100);
            
                if (type === 'attack') {
                    setTimeout(() => logToTerminal("<span class='term-white'> > Checking Trie Database...</span>"), 200);
                    setTimeout(() => logToTerminal("<span class='term-blue'> > [BLOCK] MATCH FOUND IN DB</span>"), 300);
                } else {
                    setTimeout(() => logToTerminal("<span class='text-green'> > No Block Rules Found. Forwarding.</span>"), 300);
                }
            }
            setTimeout(() => { clickCount = 0; }, 10000); 
        }

        function updateTrieRules() {
            fetch('/trie_rules').then(res => res.json()).then(data => {
                let html = "<tr><td class='term-yellow'>[RATE]</td><td>3 req / 10s</td></tr>";
                data.forEach(rule => { html += `<tr><td class="term-red">[BLOCK]</td><td>${rule.ip}</td></tr>`; });
                document.getElementById('trieTable').innerHTML = html;
            }).catch(e => {});
        }
        updateTrieRules();

        let lastGreen = -1, lastRed = -1;
        setInterval(() => {
            fetch('/logs_defense').then(res => res.json()).then(data => {
                const safeTable = document.getElementById('safeTable');
                const attackTable = document.getElementById('attackTable');
                let currGreen = 0, currRed = 0, safeHTML = "", attackHTML = "";

                for (let i = data.length - 1; i >= 0; i--) {
                    let log = data[i];
                    if (log.type === 'G') {
                        currGreen++;
                        safeHTML += `<tr><td>${log.id}</td><td class="text-green">${log.ip}</td><td>${log.info}</td></tr>`;
                    } else {
                        currRed++;
                        attackHTML += `<tr><td>${log.id}</td><td class="text-red">${log.ip}</td><td class="text-blue">${log.info}</td></tr>`;
                    }
                }
                safeTable.innerHTML = safeHTML;
                attackTable.innerHTML = attackHTML;

                if (lastGreen !== -1) {
                    chart.data.datasets[0].data.push(Math.max(0, currGreen - lastGreen)); chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.push(Math.max(0, currRed - lastRed)); chart.data.datasets[1].data.shift();
                    chart.update();
                }
                lastGreen = currGreen; lastRed = currRed;
            }).catch(e => {});
        }, 300); 
    </script>
</body>
</html>
